name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python tests/test_prescan.py

      - name: Smoke test on example
        run: |
          python prescan.py --version
          python prescan.py --list-genres
          python prescan.py examples/sample.md --out /tmp/report.md
          test -s /tmp/report.md
          grep -q "摘要" /tmp/report.md
